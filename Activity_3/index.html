<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Royale Binder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    :root {
      --navy: #0b1431; --blue: #1b2b5e; --gold: #f5c542; --spine: 34px;
      --common: #9fb3c8; --rare: #ff9f1a; --epic: #b44cff; --legendary: #2fe6ff; --champion: #ffd23f;
    }
    body { background: radial-gradient(circle at 50% 0, #24397a, var(--navy) 70%) fixed; color: #fff; min-height: 100vh; }
    .title { font-weight: 800; letter-spacing: 1px; color: var(--gold); text-shadow: 0 3px 0 #7a5a00; }
    .r-common { --c: var(--common); } .r-rare { --c: var(--rare); } .r-epic { --c: var(--epic); }
    .r-legendary { --c: var(--legendary); } .r-champion { --c: var(--champion); } .r-all { --c: #fff; }

        .back-btn { position: fixed; top: 20px; left: 24px; z-index: 1000; font-size: 14px; font-weight: 500; color: #fff;
      background: rgba(20, 20, 24, .6); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(10px);
      transition: transform .25s, border-color .25s, background .25s; }
    .back-btn:hover { transform: translateX(-2px); border-color: rgba(240, 184, 110, .6); background: rgba(30, 28, 26, .75); color: #fff; }
    .back-btn svg { width: 20px; height: 20px; }

        .toolbar { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
      padding: 14px; backdrop-filter: blur(8px); max-width: 820px; margin-left: auto; margin-right: auto; }
    .toolbar .input-group-text, .toolbar .form-control, .toolbar .form-select {
      background-color: rgba(8,14,38,.6); border-color: rgba(255,255,255,.14); color: #fff; }
    .toolbar .input-group-text { color: var(--gold); font-weight: 600; font-size: .85rem; }
    .toolbar .form-control::placeholder { color: rgba(255,255,255,.45); }
    .toolbar .form-control:focus, .toolbar .form-select:focus { border-color: var(--gold); box-shadow: 0 0 0 .2rem rgba(245,197,66,.18); }
    .toolbar svg { width: 18px; height: 18px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.18);
      background: rgba(8,14,38,.5); color: #fff; border-radius: 20px; padding: 5px 14px; font-weight: 600; font-size: .85rem;
      transition: background .2s, border-color .2s, box-shadow .2s; }
    .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
    .chip:hover { border-color: var(--c); }
    .chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, #0b1431); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 45%, transparent); }

        .f-all { --c: #fff; } .f-evo { --c: #b44cff; } .f-hero { --c: #4da3ff; } .f-both { --c: var(--gold); }
    .filter-label { text-align: center; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin-bottom: 8px; }
    .chips + .filter-label { margin-top: 16px; }

        .tags { position: absolute; top: 5px; right: 5px; z-index: 2; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
    .tag { font-size: .55rem; font-weight: 800; letter-spacing: .04em; line-height: 1; padding: 3px 5px; border-radius: 8px; color: #fff; border: 1px solid rgba(255,255,255,.85); text-shadow: 0 1px 2px #000; }
    .tag.evo { background: #8a2be2; } .tag.hero { background: #1f7ae0; }

        .binder { position: relative; max-width: 820px; margin-left: auto; margin-right: auto;
      padding: 26px 26px 26px 18px; border-radius: 22px; border: 5px solid #060b1f;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px),
        linear-gradient(145deg, #22397d 0%, #12204d 55%, #0a1230 100%);
      box-shadow: 0 25px 55px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.18), inset 0 -4px 10px rgba(0,0,0,.5); }
        .binder::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 46px; border-radius: 17px 0 0 17px;
      background: linear-gradient(90deg, #040817, #0d1736 70%, #162553);
      box-shadow: inset -6px 0 10px rgba(0,0,0,.5); pointer-events: none; }
        .binder::after { content: ''; position: absolute; inset: 8px 8px 8px 54px; border: 2px dashed rgba(245,197,66,.4);
      border-radius: 14px; pointer-events: none; }

    .page-area { position: relative; margin-left: 40px; z-index: 1; }
    .sheet { position: relative; background: linear-gradient(180deg, #243a80, var(--blue) 40%, #17264f);
      border-radius: 6px 14px 14px 6px; padding: 18px 16px 8px 40px; transform-origin: left center; backface-visibility: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 6px 0 12px rgba(0,0,0,.28),
        3px 3px 0 #16245a, 6px 6px 0 #101c45, 9px 9px 0 #0a1330, 12px 14px 18px rgba(0,0,0,.45); }
        .sheet::before { content: ''; position: absolute; left: 6px; top: 0; width: 26px; height: 100%; pointer-events: none;
      background:
        radial-gradient(circle at 50% 14%, #050a1c 0 7px, rgba(255,255,255,.18) 8px, transparent 9px),
        radial-gradient(circle at 50% 50%, #050a1c 0 7px, rgba(255,255,255,.18) 8px, transparent 9px),
        radial-gradient(circle at 50% 86%, #050a1c 0 7px, rgba(255,255,255,.18) 8px, transparent 9px); }

        .ring { position: absolute; left: -22px; width: 66px; height: 28px; z-index: 5; pointer-events: none; transform: translateY(-50%);
      border-radius: 16px; border: 5px solid; border-color: #f2f5fb #7d869c #4a5266 #c9ced9;
      background: linear-gradient(180deg, rgba(255,255,255,.12), transparent 60%);
      box-shadow: 0 4px 6px rgba(0,0,0,.55), inset 0 2px 3px rgba(0,0,0,.5); }
    .ring.r1 { top: 14%; } .ring.r2 { top: 50%; } .ring.r3 { top: 86%; }

        .sheet.out-next { animation: outNext .32s ease-in forwards; }
    .sheet.in-next { animation: inNext .3s ease-out; }
    .sheet.out-prev { animation: outPrev .16s ease-in forwards; }
    .sheet.in-prev { animation: inPrev .38s cubic-bezier(.2,.7,.3,1); }
    @keyframes outNext { to { transform: perspective(1600px) rotateY(-100deg); opacity: .15; } }
    @keyframes inNext { from { opacity: 0; transform: scale(.985); } }
    @keyframes outPrev { to { filter: brightness(.7); opacity: .65; } }
    @keyframes inPrev { from { transform: perspective(1600px) rotateY(-100deg); opacity: .15; } }

        .pocket { display: block; position: relative; padding: 5px; border-radius: 12px; text-decoration: none; color: #fff;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.26); overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(255,255,255,.22), inset 0 -3px 6px rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.35); transition: box-shadow .25s, transform .25s; }
    .pocket::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,.22) 44%, rgba(255,255,255,.05) 52%, transparent 62%); }
    .pocket:hover { color: #fff; transform: translateY(-3px); box-shadow: inset 0 2px 5px rgba(255,255,255,.25), 0 0 0 1px var(--c), 0 0 20px var(--c); }
    .face { position: relative; aspect-ratio: 5 / 7; border-radius: 9px; border: 2px solid var(--c); overflow: hidden;
      display: flex; flex-direction: column;
      background: linear-gradient(165deg, color-mix(in srgb, var(--c) 38%, #14224f), #0c1535 85%); }
        .art { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 9% 1% 11%; }
    .art img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.12); filter: drop-shadow(0 4px 5px rgba(0,0,0,.55)); }
    .foot { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; padding: 14px 3px 6px; background: linear-gradient(transparent, rgba(0,0,0,.75) 55%); }
    .cname { font-weight: 700; font-size: clamp(.56rem, 2vw, .86rem); line-height: 1.05; }
    .rtag { font-size: .62rem; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .04em; }
    .elixir { position: absolute; top: 5px; left: 5px; width: 24px; height: 29px; z-index: 2; display: flex; align-items: center; justify-content: center;
      background: #c43bd9; border: 2px solid #fff; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; font-weight: 800; font-size: .8rem; text-shadow: 0 1px 2px #000; }

        .pager { display: flex; justify-content: center; align-items: center; gap: 10px; }
    .pager .page-link { cursor: pointer; background: var(--gold); color: #000; border: 0; font-weight: 700; border-radius: 20px; padding: 7px 18px; }
    .pager .mid { background: rgba(255,255,255,.12); color: #fff; min-width: 90px; text-align: center; cursor: default; }

    .binder { touch-action: pan-y; }
    @media (hover: none) { .pocket:hover { transform: none; } }

        @media (max-width: 767.98px) {
      .container { padding-left: 10px; padding-right: 10px; }

            .toolbar { padding: 10px; border-radius: 14px; }
      .toolbar .row.mb-3 { margin-bottom: .6rem !important; }
      .toolbar .form-control, .toolbar .form-select { font-size: 16px; }
      .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .chip { justify-content: center; padding: 7px 4px; font-size: .8rem; gap: 5px; }
      .chips.forms { grid-template-columns: repeat(2, 1fr); }
      .tag { font-size: .45rem; padding: 2px 3px; border-radius: 6px; }
      .tags { top: 2px; right: 2px; gap: 2px; }

            .binder { padding: 10px 10px 10px 6px; border-width: 4px; border-radius: 16px; }
      .binder::before { width: 26px; border-radius: 12px 0 0 12px; }
      .binder::after { inset: 5px 5px 5px 30px; border-width: 1.5px; border-radius: 10px; }
      .page-area { margin-left: 20px; }
      .ring { left: -12px; width: 40px; height: 18px; border-width: 3px; border-radius: 10px; }
      .sheet { padding: 8px 5px 2px 22px; border-radius: 4px 10px 10px 4px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 4px 0 8px rgba(0,0,0,.28),
          2px 2px 0 #16245a, 4px 4px 0 #101c45, 6px 8px 12px rgba(0,0,0,.45); }
      .sheet::before { left: 2px; width: 18px;
        background:
          radial-gradient(circle at 50% 14%, #050a1c 0 5px, rgba(255,255,255,.18) 6px, transparent 7px),
          radial-gradient(circle at 50% 50%, #050a1c 0 5px, rgba(255,255,255,.18) 6px, transparent 7px),
          radial-gradient(circle at 50% 86%, #050a1c 0 5px, rgba(255,255,255,.18) 6px, transparent 7px); }
      #parent { --bs-gutter-x: .4rem; --bs-gutter-y: .4rem; }

            .pocket { padding: 2px; border-radius: 8px; }
      .face { border-radius: 6px; border-width: 1.5px; }
      .art { padding: 6% 0 9%; }
      .art img { transform: scale(1.2); }
      .elixir { width: 17px; height: 21px; font-size: .6rem; top: 2px; left: 2px; border-width: 1.5px; }
      .foot { padding: 10px 1px 3px; }
      .cname { font-size: .55rem; }
      .rtag { display: none; }

            .pager { position: sticky; bottom: 0; z-index: 50; margin: 0 -10px !important; gap: 12px;
        padding: 14px 10px calc(12px + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, rgba(11,20,49,.95) 40%); }
      .pager .page-link { min-height: 44px; display: inline-flex; align-items: center; padding: 8px 22px; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
      .pager .mid { min-width: 84px; justify-content: center; box-shadow: none; }
    }
    @media (max-width: 575.98px) {
            .back-btn { position: absolute; top: 12px; left: 12px; padding: 9px !important; }
      .title { font-size: 1.4rem; }
    }
  </style>
</head>

<body>
  <a href="../index.html" class="back-btn btn rounded-pill d-inline-flex align-items-center gap-2 px-3 py-2"
    aria-label="Back to Web Development activities">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
    <span class="d-none d-sm-inline">Back</span>
  </a>

  <div class="container-fluid shadow mb-4" style="background: var(--navy); border-bottom: 4px solid var(--gold);">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 title py-3">Royale Binder</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="toolbar mb-4">
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-7">
          <div class="input-group">
            <span class="input-group-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
            </span>
            <input type="text" id="search" class="form-control" placeholder="Search a card...">
          </div>
        </div>
        <div class="col-12 col-md-5">
          <div class="input-group">
            <span class="input-group-text">Sort by</span>
            <select id="sort" class="form-select">
              <option value="id">Binder order</option>
              <option value="elixirAsc">Elixir: low to high</option>
              <option value="elixirDesc">Elixir: high to low</option>
              <option value="rarity">Rarity: common first</option>
              <option value="rarityDesc">Rarity: champion first</option>
              <option value="name">Name: A to Z</option>
            </select>
          </div>
        </div>
      </div>
      <div class="filter-label">Rarity</div>
      <div class="chips" id="chips"></div>
      <div class="filter-label">Special Forms</div>
      <div class="chips forms" id="formChips"></div>
    </div>

    <div class="binder mb-4">
      <div class="page-area">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="sheet" id="sheet">
          <div class="row row-cols-4 g-2 g-md-3" id="parent">
            <div class="col-12 text-center py-5"><div class="spinner-border text-warning" role="status"><span class="visually-hidden">Loading...</span></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-md-none text-center small mb-2" style="opacity:.55">Swipe the binder to turn pages</div>

    <nav class="pager pb-4">
      <a class="page-link" onclick="prev()">&larr; Prev</a>
      <a class="page-link mid" id="currentPage">1</a>
      <a class="page-link" onclick="next()">Next &rarr;</a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    // ---- LIVE API via the RoyaleAPI proxy (key must whitelist the proxy IP) ----
    const API_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiIsImtpZCI6IjI4YTMxOGY3LTAwMDAtYTFlYi03ZmExLTJjNzQzM2M2Y2NhNSJ9.eyJpc3MiOiJzdXBlcmNlbGwiLCJhdWQiOiJzdXBlcmNlbGw6Z2FtZWFwaSIsImp0aSI6ImIzMDc2ZWE5LTU5YTktNGRhNC05ZGVlLWJkNDYxNjcwODg5ZCIsImlhdCI6MTc5Mzg4NDU4MCwic3ViIjoiZGV2ZWxvcGVyLzU4MDIzOWFlLWRkZDktNDhmNy04MTc5LTRhN2UzMGNkZjZiNCIsInNjb3BlcyI6WyJyb3lhbGUiXSwibGltaXRzIjpbeyJ0aWVyIjoiZGV2ZWxvcGVyL3NpbHZlciIsInR5cGUiOiJ0aHJvdHRsaW5nIn0seyJjaWRycyI6WyI0NS43OS4yMTguNzkiXSwidHlwZSI6ImNsaWVudCJ9XX0.AQ9l-DX6LTTdOp_cyB6zAsJIXXxobFTYX98FnslY2jEiv4T2WVAw-6fpKj1_aq0ZCnqKQoMFrBYO9lA-LTbfmA';
    async function loadCards() {
      const cached = sessionStorage.getItem('cr_cards');
      if (cached) return JSON.parse(cached);
      const response = await fetch('https://proxy.royaleapi.dev/v1/cards', {
        headers: { Authorization: 'Bearer ' + API_KEY }
      });
      if (!response.ok) throw new Error('API ' + response.status + ': ' + (await response.text()));
      const data = await response.json();
      sessionStorage.setItem('cr_cards', JSON.stringify(data.items));
      return data.items;
    }

    const rankOf = { common: 1, rare: 2, epic: 3, legendary: 4, champion: 5 };
    const sorters = {
      id: (a, b) => a.id - b.id,
      elixirAsc: (a, b) => (a.elixirCost ?? 99) - (b.elixirCost ?? 99) || a.name.localeCompare(b.name),
      elixirDesc: (a, b) => (b.elixirCost ?? -1) - (a.elixirCost ?? -1) || a.name.localeCompare(b.name),
      rarity: (a, b) => rankOf[a.rarity] - rankOf[b.rarity] || a.name.localeCompare(b.name),
      rarityDesc: (a, b) => rankOf[b.rarity] - rankOf[a.rarity] || a.name.localeCompare(b.name),
      name: (a, b) => a.name.localeCompare(b.name)
    };

    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const urlParams = new URLSearchParams(window.location.search);
    var page = Number(urlParams.get('page')) || 1;
    var q = urlParams.get('q') || '';
    var sort = urlParams.get('sort') || 'id';
    var rarity = urlParams.get('rarity') || 'all';
    var form = urlParams.get('form') || 'all';

    var perPageLoad = 12;
    var lastPage = 1;
    var allCards = [];
    var busy = false;

    var elParent = document.getElementById("parent");
    var elSheet = document.getElementById("sheet");
    var elCurrentPage = document.getElementById("currentPage");
    var elSearch = document.getElementById("search");
    var elSort = document.getElementById("sort");
    var elChips = document.getElementById("chips");
    var elFormChips = document.getElementById("formChips");

    const hasEvo = c => !!(c.iconUrls && c.iconUrls.evolutionMedium);
    const hasHero = c => !!(c.iconUrls && c.iconUrls.heroMedium);
    const formMatch = (c, f) => f === 'all' || (f === 'evo' && hasEvo(c)) || (f === 'hero' && hasHero(c)) || (f === 'both' && hasEvo(c) && hasHero(c));
    const qs = () => 'page=' + page + '&q=' + encodeURIComponent(q) + '&sort=' + sort + '&rarity=' + rarity + '&form=' + form;

    elSearch.value = q;
    elSort.value = sort;

    function buildChips() {
      elChips.innerHTML = '';
      ['all', 'common', 'rare', 'epic', 'legendary', 'champion'].forEach(r => {
        var b = document.createElement('button');
        b.className = 'chip r-' + r + (rarity === r ? ' on' : '');
        b.innerHTML = '<span class="dot"></span>' + capitalizeFirstLetter(r);
        b.onclick = () => { rarity = r; page = 1; buildChips(); getCards(); };
        elChips.appendChild(b);
      });
    }

    function buildFormChips() {
      elFormChips.innerHTML = '';
      [['all', 'All'], ['evo', 'Evolution'], ['hero', 'Hero'], ['both', 'Evo + Hero']].forEach(([k, label]) => {
        var b = document.createElement('button');
        b.className = 'chip f-' + k + (form === k ? ' on' : '');
        b.innerHTML = '<span class="dot"></span>' + label;
        b.onclick = () => { form = k; page = 1; buildFormChips(); getCards(); };
        elFormChips.appendChild(b);
      });
    }

    const getCards = () => {
      var list = allCards.filter(c =>
        (rarity === 'all' || c.rarity === rarity) && formMatch(c, form) && c.name.toLowerCase().includes(q.toLowerCase()));
      list.sort(sorters[sort]);

      lastPage = Math.max(1, Math.ceil(list.length / perPageLoad));
      if (page > lastPage) page = lastPage;
      elCurrentPage.innerHTML = page + ' / ' + lastPage;
      history.replaceState(null, '', '?' + qs());

      var start = perPageLoad * (page - 1);
      var html = '';
      list.slice(start, start + perPageLoad).forEach(c => {
        var link = 'view.html?id=' + c.id + '&' + qs();
        html += `
          <div class="col">
            <a class="pocket r-` + c.rarity + `" href="` + link + `">
              <div class="face">
                <span class="elixir">` + (c.elixirCost ?? '?') + `</span>
                <div class="tags">` + (hasEvo(c) ? '<span class="tag evo">EVO</span>' : '') + (hasHero(c) ? '<span class="tag hero">HERO</span>' : '') + `</div>
                <div class="art"><img src="` + c.iconUrls.medium + `" alt="` + c.name + `" loading="lazy"></div>
                <div class="foot">
                  <div class="cname">` + c.name + `</div>
                  <div class="rtag">` + c.rarity + `</div>
                </div>
              </div>
            </a>
          </div>`;
      });
      elParent.innerHTML = html || '<div class="col-12 text-center py-5 h5">No cards found. Try another search.</div>';
    }

    function flip(dir, change) {
      if (busy) return;
      busy = true;
      elSheet.className = 'sheet out-' + dir;
      setTimeout(() => {
        change();
        elSheet.className = 'sheet in-' + dir;
        setTimeout(() => { elSheet.className = 'sheet'; busy = false; }, dir === 'prev' ? 380 : 300);
      }, dir === 'next' ? 320 : 160);
    }

    function prev() {
      flip('prev', () => {
        page = Number(page) - 1;
        if (page == 0) page = lastPage;
        getCards();
      });
    }

    function next() {
      flip('next', () => {
        page = Number(page) + 1;
        if (page > lastPage) page = 1;
        getCards();
      });
    }

    elSearch.addEventListener('input', () => { q = elSearch.value; page = 1; getCards(); });
    elSort.addEventListener('change', () => { sort = elSort.value; page = 1; getCards(); });

    var tx = 0, ty = 0;
    var elBinder = document.querySelector('.binder');
    elBinder.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    elBinder.addEventListener('touchend', (e) => {
      var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * 0.6) { dx < 0 ? next() : prev(); }
    }, { passive: true });

    loadCards().then(cards => {
      allCards = cards;
      buildChips();
      buildFormChips();
      getCards();
    }).catch((err) => {
      console.error(err);
      elParent.innerHTML = '<div class="col-12 text-center py-5"><div class="h5">Could not load cards.</div><code class="text-warning">' + err.message + '</code></div>';
    });
  </script>
</body>

</html>
