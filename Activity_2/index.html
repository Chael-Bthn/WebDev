<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mixtape Archives</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    :root { --bg: #0d0d11; --surface: #151515; --accent: #f0b86e; --card-w: 300px; --gap: 24px; }
    html { background: var(--bg); }
    body { min-height: 100vh; overflow-x: hidden; background: transparent; }

    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(circle 120px at 14% -2%, rgba(255, 214, 150, .55), transparent),
        radial-gradient(circle 90px at 90% -2%, rgba(255, 200, 130, .28), transparent),
        conic-gradient(from 158deg at 14% -3%, transparent 0deg, rgba(255, 196, 120, .20) 22deg, transparent 44deg),
        conic-gradient(from 164deg at 90% -3%, transparent 0deg, rgba(255, 196, 120, .11) 16deg, transparent 32deg),
        radial-gradient(ellipse 55% 45% at 14% 0%, rgba(240, 184, 110, .20), transparent 70%),
        radial-gradient(ellipse 45% 35% at 90% 0%, rgba(240, 184, 110, .10), transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 110%, rgba(120, 110, 150, .12), transparent 70%),
        var(--bg);
    }

    .track {
      display: flex; gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
      padding: 30px calc(50% - var(--card-w) / 2); scrollbar-width: none;
    }
    .track::-webkit-scrollbar { display: none; }

    .song-card {
      flex: 0 0 var(--card-w); scroll-snap-align: center; position: relative; overflow: hidden; isolation: isolate;
      background: var(--surface); border-color: rgba(255, 255, 255, .08);
      opacity: .45; transform: scale(.88);
      transition: transform .45s ease, opacity .45s ease, border-color .45s ease, box-shadow .45s ease;
      animation: rise .6s ease both;
    }
    .song-card:not(.active) { cursor: pointer; }
    .song-card.active { opacity: 1; transform: scale(1); border-color: rgba(240, 184, 110, .5); }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.88); } }

    .song-card::before {
      content: ""; position: absolute; inset: 0; z-index: -3; opacity: 0; transition: opacity .6s ease;
      background: linear-gradient(160deg, hsl(var(--h) 60% 30%), hsl(calc(var(--h) + 50) 60% 12%));
    }
    .song-card::after {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0, 0, 0, .05), rgba(0, 0, 0, .45));
    }
    .bg-blur {
      position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); z-index: -2;
      object-fit: cover; filter: blur(28px) brightness(.55) saturate(1.3); opacity: 0; transition: opacity .6s ease;
    }
    .song-card.active::before, .song-card.active .bg-blur { opacity: 1; }

    .cover {
      position: relative; aspect-ratio: 1 / 1; font-size: 72px; font-weight: 700;
      background: linear-gradient(135deg, hsl(var(--h) 70% 45%), hsl(calc(var(--h) + 50) 70% 22%));
    }
    .cover span { opacity: .85; text-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .artist { color: var(--accent); font-weight: 500; }

    .wave-btn {
      width: 96px; height: 40px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18);
      backdrop-filter: blur(6px); transition: border-color .25s, background .25s;
    }
    .wave-btn:hover { border-color: rgba(240, 184, 110, .8); background: rgba(240, 184, 110, .15); }
    .bars { gap: 3px; height: 24px; }
    .bars i { display: block; width: 3px; border-radius: 2px; background: var(--accent); }
    .bars i:nth-child(1) { height: 8px; } .bars i:nth-child(2) { height: 16px; } .bars i:nth-child(3) { height: 24px; }
    .bars i:nth-child(4) { height: 14px; } .bars i:nth-child(5) { height: 20px; } .bars i:nth-child(6) { height: 10px; }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 44px; height: 44px;
      background: rgba(20, 20, 24, .7); border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(10px); transition: border-color .25s, background .25s;
    }
    .nav-btn:hover { border-color: rgba(240, 184, 110, .6); background: rgba(30, 28, 26, .85); }
    .nav-btn svg, .back-btn svg { width: 20px; height: 20px; }
    .nav-prev { left: 12px; }
    .nav-next { right: 12px; }

    .back-btn {
      position: fixed; top: 24px; left: 24px; z-index: 1000; font-size: 14px; font-weight: 500;
      background: rgba(20, 20, 24, .6); border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(10px); transition: transform .25s, border-color .25s, background .25s;
    }
    .back-btn:hover { transform: translateX(-2px); border-color: rgba(240, 184, 110, .6); background: rgba(30, 28, 26, .75); }

    @media (max-width: 767.98px) {
      .back-btn { top: 14px; left: 14px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <a href="../index.html" class="back-btn btn rounded-pill d-inline-flex align-items-center gap-2 px-3 py-2"
    aria-label="Back to Web Development activities">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
    Back
  </a>

  <div class="container text-center pt-5 mt-5">
    <div class="row">
      <div class="col-12">
        <h1 class="mb-1">Mixtape Archives</h1>
        <p class="text-white-50 mb-0">Chael's personalized playlist</p>
      </div>
    </div>
  </div>

  <div class="position-relative w-100">
    <button class="nav-btn nav-prev btn rounded-circle d-none d-md-flex align-items-center justify-content-center p-0"
      id="prev" aria-label="Previous song">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
    </button>

    <div class="track" id="parent"></div>

    <button class="nav-btn nav-next btn rounded-circle d-none d-md-flex align-items-center justify-content-center p-0"
      id="next" aria-label="Next song">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
    </button>
  </div>

  <div class="text-center text-white-50 pb-4 mt-2" id="counter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var parent = document.getElementById("parent");
    var counter = document.getElementById("counter");

    fetch("songs.json")
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Could not load songs.json (status " + response.status + ")");
        }
        return response.json();
      })
      .then(function (songs) {
        for (var i = 0; i < songs.length; i++) {
          var song = songs[i];
          var date = new Date(song.releaseDate + "T00:00:00").toLocaleDateString("en-US", {
            year: "numeric", month: "long", day: "numeric"
          });
          var features = song.features.length > 0 ? song.features.join(", ") : "None";

          parent.innerHTML += `
            <div class="song-card card rounded-4 shadow-lg p-3 text-center" style="--h: ${(i * 47) % 360}; animation-delay: ${i * 0.08}s">
              <img class="bg-blur" src="${song.cover}" alt="" onerror="this.remove()">
              <div class="cover rounded-3 shadow d-flex align-items-center justify-content-center overflow-hidden">
                <span>${song.song.charAt(0)}</span>
                <img src="${song.cover}" alt="${song.song} cover" onerror="this.remove()">
              </div>
              <div class="pt-3 px-1 pb-1">
                <div class="h5 fw-semibold mb-0">${song.song}</div>
                <div class="artist mb-2">${song.artist}</div>
                <div class="small text-white-50">
                  <div>Features: ${features}</div>
                  <div>Released: ${date}</div>
                </div>
                <a class="wave-btn d-inline-flex align-items-center justify-content-center rounded-pill mt-3"
                  href="${song.spotify}" target="_blank" rel="noopener"
                  aria-label="Open ${song.song} on Spotify" title="Open on Spotify">
                  <span class="bars d-inline-flex align-items-center"><i></i><i></i><i></i><i></i><i></i><i></i></span>
                </a>
              </div>
            </div>
          `;
        }

        setupCarousel();
      })
      .catch(function (error) {
        parent.innerHTML = `<div class="container"><div class="alert alert-danger">${error.message}</div></div>`;
      });

    function setupCarousel() {
      var cards = parent.querySelectorAll(".song-card");
      var current = -1;
      var ticking = false;

      function updateActive() {
        var box = parent.getBoundingClientRect();
        var center = box.left + box.width / 2;
        var best = 0;
        var bestDist = Infinity;

        for (var i = 0; i < cards.length; i++) {
          var r = cards[i].getBoundingClientRect();
          var dist = Math.abs(r.left + r.width / 2 - center);
          if (dist < bestDist) {
            bestDist = dist;
            best = i;
          }
        }

        if (best !== current) {
          if (current >= 0) {
            cards[current].classList.remove("active");
          }
          cards[best].classList.add("active");
          counter.textContent = (best + 1) + " / " + cards.length;
          current = best;
        }
        ticking = false;
      }

      function go(index) {
        index = Math.max(0, Math.min(cards.length - 1, index));
        cards[index].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }

      parent.addEventListener("scroll", function () {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(updateActive);
        }
      });

      for (var i = 0; i < cards.length; i++) {
        cards[i].addEventListener("click", function (e) {
          var index = Array.prototype.indexOf.call(cards, this);
          if (index !== current) {
            e.preventDefault();
            go(index);
          }
        });
      }

      document.getElementById("next").onclick = function () { go(current + 1); };
      document.getElementById("prev").onclick = function () { go(current - 1); };
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { go(current + 1); }
        if (e.key === "ArrowLeft") { go(current - 1); }
      });

      parent.scrollLeft = 0;
      updateActive();
    }
  </script>
</body>

</html>
